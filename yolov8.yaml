type: yolov8                      # 必须！模型适配器类型（如 yolov5, yolov8, yolov11, segment_anything 等）
name: best_onnx        # 模型唯一标识名（尽量保持唯一，不含特殊字符）
display_name: oil_level_gauge    # 显示在 X-AnyLabeling 软件界面下拉菜单中的名字
provider: Custom                 # 模型提供方/训练者（可自定义填写）

# 模型路径（支持绝对路径或相对于 YAML 的相对路径）
model_path: C:/Users/elitedatai/Desktop/best.onnx  # Windows 路径如 C:/models/best.onnx，注意使用斜杠 /

# 后端推理引擎（选填，默认 ort）
engine: ort                      # ort: ONNX Runtime (默认) | dnn: OpenCV DNN | trt: TensorRT (.engine)

# 后处理参数
conf_threshold: 0.25             # 置信度阈值（低于该值的框会被过滤）
iou_threshold: 0.45              # NMS 抑制阈值
max_det: 300                     # 单张图最大检测框数量

# 类别标签列表（顺序必须与模型训练时的类别索引 0, 1, 2... 完全一致）
classes:
  - oil_level_gauge